name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # مفاتيح عامة (client-side) — نفس قيم .env المحلي
  VITE_SUPABASE_URL: https://nagzoafkitfsqlcwsdau.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_g1ShhVbNXMlzc2g8bGs1bA_kajZIdAZ
  VITE_SUPABASE_PROJECT_ID: nagzoafkitfsqlcwsdau

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --fetch-retries=3

      - name: Build web + sync Capacitor
        run: node scripts/build-mobile.mjs

      - name: Clean local-only Gradle overrides
        run: sed -i '/aapt2FromMavenOverride/d' android/gradle.properties

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK (release)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sooqy-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error